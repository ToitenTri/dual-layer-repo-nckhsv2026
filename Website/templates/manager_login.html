{% extends "base.html" %}
{% block content %}
    <div class="login-box">
        <h2>Đăng Nhập Quản Trị Viên & Nghiên Cứu Viên</h2>
        <p class="subtitle">Khu vực dành riêng để quản lý cơ sở dữ liệu thực nghiệm, khóa mã hóa và kiểm định trích xuất.</p>
        <form method="POST">
            <div class="form-group">
                <label>Tài khoản Quản trị (Mặc định: admin):</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu (Mặc định: 123456):</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-submit">Truy cập Manager Dashboard</button>
        </form>
    </div>
{% endblock %}
